[project]
name = "vetpivot-career-agent"
version = "0.1.0"
description = "Mission 1 CLI demo for translating military experience and evaluating civilian job fit."
requires-python = ">=3.11"
dependencies = ["fastapi"]

[project.optional-dependencies]
api = ["uvicorn"]
live = ["google-adk"]

[project.scripts]
vetpivot = "vetpivot.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
